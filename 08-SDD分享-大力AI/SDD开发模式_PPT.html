<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDD 开发模式 PPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ===========================================
       CSS CUSTOM PROPERTIES: SDD DARK THEME
       =========================================== */
    :root {
      --bg-primary: #080d19;
      --bg-secondary: #111827;
      --bg-panel: rgba(18, 25, 41, 0.82);
      --bg-panel-soft: rgba(255, 255, 255, 0.045);
      --text-primary: #f8fafc;
      --text-secondary: #aab2c5;
      --text-muted: #6f7a91;
      --accent: #f4a62a;
      --accent-2: #39d7b6;
      --accent-blue: #66a3ff;
      --danger: #ff6978;
      --ok: #7de38d;
      --line: rgba(255,255,255,0.12);
      --shadow: rgba(0, 0, 0, 0.36);
      --font-display: "Noto Serif SC", serif;
      --font-body: "IBM Plex Sans SC", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --title-size: clamp(2rem, 5.8vw, 5.2rem);
      --h2-size: clamp(1.35rem, 3vw, 3.1rem);
      --h3-size: clamp(0.95rem, 1.8vw, 1.55rem);
      --body-size: clamp(0.72rem, 1.28vw, 1.08rem);
      --small-size: clamp(0.58rem, 0.86vw, 0.82rem);
      --slide-padding: clamp(1rem, 4vw, 4rem);
      --content-gap: clamp(0.6rem, 1.8vw, 1.8rem);
      --element-gap: clamp(0.35rem, 1vw, 1rem);
      --radius: clamp(0.55rem, 1.2vw, 1.2rem);
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-normal: 0.65s;
    }

    /* ===========================================
       BASE RESET
       =========================================== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--bg-primary); color: var(--text-primary); }

    /* ===========================================
       VIEWPORT FITTING: MANDATORY BASE STYLES
       Include this ENTIRE file in every presentation.
       These styles ensure slides fit exactly in the viewport.
       =========================================== */
    html, body { height: 100%; overflow-x: hidden; }
    html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    .slide { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; }
    .slide-content { flex: 1; display: flex; flex-direction: column; justify-content: center; max-height: 100%; overflow: hidden; padding: var(--slide-padding); }
    .card, .container, .content-box { max-width: min(90vw, 1000px); max-height: min(80vh, 700px); }
    .feature-list, .bullet-list { gap: clamp(0.4rem, 1vh, 1rem); }
    .feature-list li, .bullet-list li { font-size: var(--body-size); line-height: 1.4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: clamp(0.5rem, 1.5vw, 1rem); }
    img, .image-container { max-width: 100%; max-height: min(50vh, 400px); object-fit: contain; }
    @media (max-height: 700px) { :root { --slide-padding: clamp(0.75rem, 3vw, 2rem); --content-gap: clamp(0.4rem, 1.5vw, 1rem); --title-size: clamp(1.25rem, 4.5vw, 2.5rem); --h2-size: clamp(1rem, 3vw, 1.75rem); } }
    @media (max-height: 600px) { :root { --slide-padding: clamp(0.5rem, 2.5vw, 1.5rem); --content-gap: clamp(0.3rem, 1vw, 0.75rem); --title-size: clamp(1.1rem, 4vw, 2rem); --body-size: clamp(0.7rem, 1.2vw, 0.95rem); } .nav-dots, .keyboard-hint, .decorative { display: none; } }
    @media (max-height: 500px) { :root { --slide-padding: clamp(0.4rem, 2vw, 1rem); --title-size: clamp(1rem, 3.5vw, 1.5rem); --h2-size: clamp(0.9rem, 2.5vw, 1.25rem); --body-size: clamp(0.65rem, 1vw, 0.85rem); } }
    @media (max-width: 600px) { :root { --title-size: clamp(1.25rem, 7vw, 2.5rem); } .grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; } html { scroll-behavior: auto; } }

    /* ===========================================
       BACKGROUND ATMOSPHERE
       =========================================== */
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 78%, rgba(244,166,42,0.15), transparent 22%),
        radial-gradient(circle at 82% 16%, rgba(86,124,255,0.16), transparent 26%),
        linear-gradient(135deg, #060912 0%, #10182d 52%, #07101f 100%);
      z-index: 0;
    }
    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: clamp(2rem, 5vw, 5rem) clamp(2rem, 5vw, 5rem);
      opacity: 0.26;
      z-index: 0;
    }
    .slide > * { position: relative; z-index: 1; }

    /* ===========================================
       TYPOGRAPHY AND SHARED COMPONENTS
       =========================================== */
    h1, h2, h3 { letter-spacing: -0.04em; }
    h1 { font-family: var(--font-display); font-size: var(--title-size); font-weight: 900; line-height: 1.05; }
    h2 { font-family: var(--font-display); font-size: var(--h2-size); font-weight: 900; line-height: 1.1; }
    h3 { font-size: var(--h3-size); font-weight: 700; }
    p, li { font-size: var(--body-size); color: var(--text-secondary); line-height: 1.55; }
    code { font-family: var(--font-mono); color: var(--accent-2); }
    .accent { color: var(--accent); }
    .muted { color: var(--text-muted); }
    .tag {
      display: inline-flex; align-items: center; gap: clamp(0.25rem,0.5vw,0.5rem);
      padding: clamp(0.24rem,0.55vw,0.45rem) clamp(0.7rem,1.2vw,1.1rem);
      border: 1px solid rgba(244,166,42,0.38); border-radius: 999px;
      background: rgba(244,166,42,0.12); color: #ffd592;
      font-family: var(--font-mono); font-size: var(--small-size); font-weight: 700;
    }
    .subtitle { margin-top: clamp(0.5rem, 1.2vw, 1.1rem); font-size: clamp(0.9rem, 1.7vw, 1.4rem); color: var(--text-secondary); }
    .caption {
      position: absolute; left: 50%; bottom: clamp(3.8rem, 7vh, 5rem); transform: translateX(-50%);
      max-width: min(72vw, 780px); padding: clamp(0.45rem, 0.8vw, 0.7rem) clamp(0.8rem, 1.4vw, 1.25rem);
      border-radius: clamp(0.35rem,0.7vw,0.65rem); background: rgba(0,0,0,0.72);
      color: var(--text-primary); font-weight: 600; font-size: clamp(0.68rem, 1.05vw, 0.95rem); text-align: center;
      box-shadow: 0 clamp(0.4rem,1vw,1rem) clamp(1rem,2vw,2rem) rgba(0,0,0,0.35);
    }
    .bottom-nav {
      position: absolute; left: 0; right: 0; bottom: 0; height: clamp(2.2rem, 5vh, 3.4rem);
      background: rgba(255,255,255,0.22); backdrop-filter: blur(10px);
      display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
      color: rgba(255,255,255,0.8); font-size: var(--small-size);
    }
    .bottom-nav span { text-align: center; border-left: 1px solid rgba(255,255,255,0.35); }
    .bottom-nav span:first-child { border-left: none; }
    .bottom-nav .active { color: white; font-weight: 700; background: rgba(255,255,255,0.12); height: 100%; display: grid; place-items: center; }

    /* ===========================================
       SLIDE LAYOUTS
       =========================================== */
    .title-layout .slide-content, .statement-layout .slide-content, .agenda-layout .slide-content { align-items: center; text-align: center; }
    .title-layout h1 { text-shadow: 0 clamp(0.4rem,1vw,1rem) clamp(1rem,2vw,2rem) rgba(0,0,0,0.35); }
    .statement-layout .crossed { position: relative; color: rgba(255,255,255,0.22); font-size: clamp(1.2rem, 3vw, 2.6rem); font-weight: 800; margin-bottom: clamp(0.2rem,0.8vw,0.8rem); }
    .statement-layout .crossed::after { content: ""; position: absolute; left: 0; right: 0; top: 52%; height: clamp(0.08rem,0.25vw,0.18rem); background: var(--danger); transform: rotate(-3deg); }
    .statement-layout h2 { color: var(--text-primary); }
    .statement-layout h2 .accent { display: inline-block; }
    .arrow-down { color: var(--accent); font-size: clamp(1rem,2vw,1.8rem); margin-bottom: clamp(0.3rem,0.8vw,0.7rem); }
    .compare-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: clamp(0.8rem, 2vw, 2rem); align-items: stretch; width: min(86vw, 980px); margin: 0 auto; }
    .compare-card, .info-card {
      background: linear-gradient(160deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025));
      border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(0.85rem, 1.7vw, 1.6rem);
      box-shadow: 0 clamp(0.6rem,1.4vw,1.3rem) clamp(1.3rem,3vw,3rem) var(--shadow);
      min-height: clamp(5rem, 10vh, 7.5rem);
    }
    .compare-card.left { background: linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02)); }
    .compare-card.right { background: linear-gradient(160deg, rgba(40,100,160,0.18), rgba(255,255,255,0.035)); }
    .icon-small { display: inline-block; font-size: clamp(1.3rem, 2.3vw, 2rem); color: var(--accent); margin-right: clamp(0.3rem,0.6vw,0.5rem); vertical-align: middle; }
    .compare-card h3 { display: flex; align-items: center; white-space: nowrap; }
    .vs { align-self: center; width: clamp(2.4rem, 4vw, 3.8rem); height: clamp(2.4rem, 4vw, 3.8rem); border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.08); border: 1px solid var(--line); font-weight: 900; }
    .bottom-note { margin: clamp(1.8rem, 5vh, 3.8rem) auto 0; max-width: min(82vw, 900px); color: var(--accent); font-weight: 700; text-align: center; font-size: clamp(0.75rem, 1.25vw, 1.05rem); }
    ul { list-style: none; display: grid; gap: clamp(0.35rem, 0.9vh, 0.75rem); margin-top: clamp(0.55rem,1vw,1rem); }
    li { display: flex; align-items: baseline; }
    li::before { content: "•"; color: var(--accent); margin-right: clamp(0.35rem,0.7vw,0.65rem); flex-shrink: 0; }
    li:has(.list-mark)::before { content: none; margin-right: 0; }
    .list-mark { display: inline-flex; place-items: center; width: clamp(1rem,1.8vw,1.35rem); margin-right: clamp(0.38rem,0.8vw,0.7rem); color: var(--accent); font-size: clamp(0.78rem,1.25vw,1rem); flex-shrink: 0; }
    .card-grid { width: min(88vw, 980px); margin: clamp(1rem,2vw,2rem) auto 0; display: grid; gap: clamp(0.7rem,1.3vw,1rem); align-items: stretch; }
    .card-grid .info-card { display: flex; flex-direction: column; justify-content: flex-start; }
    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }
    .cols-6 { grid-template-columns: repeat(6, 1fr); }
    .num { display: inline-flex; place-items: center; justify-content: center; width: clamp(1.3rem,2vw,1.85rem); height: clamp(1.3rem,2vw,1.85rem); border-radius: clamp(0.3rem,0.6vw,0.55rem); background: rgba(244,166,42,0.12); color: var(--accent); border: 1px solid rgba(244,166,42,0.24); font-family: var(--font-mono); font-size: clamp(0.55rem,0.9vw,0.75rem); margin-right: clamp(0.3rem,0.6vw,0.55rem); flex-shrink: 0; }
    .info-card h3 { display: flex; align-items: center; margin-bottom: clamp(0.35rem,0.8vw,0.7rem); white-space: nowrap; font-size: clamp(0.85rem,1.4vw,1.2rem); }
    .mini-label { display: inline-block; margin-top: clamp(0.45rem,0.9vw,0.8rem); color: var(--accent-2); font-family: var(--font-mono); font-size: var(--small-size); }
    .network { width: min(80vw, 820px); height: min(58vh, 500px); margin: clamp(0.8rem,1.6vw,1.4rem) auto 0; position: relative; }
    .center-orb { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: clamp(5rem,9vw,8rem); height: clamp(5rem,9vw,8rem); border-radius: 50%; display: grid; place-items: center; text-align: center; background: radial-gradient(circle, #ffbd35, #e98416); color: #211300; font-weight: 900; box-shadow: 0 0 clamp(1.5rem,3vw,3rem) rgba(244,166,42,0.4); font-size: clamp(0.75rem,1.4vw,1.05rem); }
    .node { position: absolute; width: clamp(11rem, 18vw, 16rem); height: clamp(5.5rem,10vh,7.5rem); }
    .node:nth-child(2) { left: 8%; top: 2%; } .node:nth-child(3) { right: 8%; top: 2%; } .node:nth-child(4) { right: 8%; bottom: 2%; } .node:nth-child(5) { left: 8%; bottom: 2%; }
    .callout { width: fit-content; max-width: min(80vw, 760px); margin: clamp(0.9rem,1.7vw,1.5rem) auto 0; padding: clamp(0.55rem,1vw,0.9rem) clamp(1rem,1.8vw,1.6rem); border-radius: 999px; background: rgba(244,166,42,0.13); border: 1px solid rgba(244,166,42,0.28); color: #ffd28b; font-weight: 700; text-align: center; font-size: var(--body-size); }
    .terminal { width: min(86vw, 1040px); height: min(62vh, 520px); margin: 0 auto; background: #07090d; border: 1px solid rgba(255,255,255,0.1); border-radius: clamp(0.5rem,1vw,0.9rem); box-shadow: 0 clamp(1rem,2vw,2rem) clamp(2rem,4vw,4rem) rgba(0,0,0,0.45); overflow: hidden; }
    .terminal-bar { height: clamp(1.8rem,3vh,2.4rem); background: #17191f; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(0.8rem,1.3vw,1.2rem); color: var(--text-muted); font-family: var(--font-mono); font-size: var(--small-size); }
    .dots { display: flex; gap: clamp(0.25rem,0.5vw,0.45rem); }
    .dot { width: clamp(0.45rem,0.8vw,0.65rem); height: clamp(0.45rem,0.8vw,0.65rem); border-radius: 50%; background: #ff5f57; } .dot:nth-child(2){background:#febc2e}.dot:nth-child(3){background:#28c840}
    .terminal-body { padding: clamp(0.8rem,1.6vw,1.5rem); font-family: var(--font-mono); font-size: clamp(0.65rem,1.15vw,0.98rem); line-height: 1.7; color: #c9d1d9; }
    .terminal-line { white-space: nowrap; overflow: hidden; }
    .terminal.typing .terminal-line { width: 0; max-width: fit-content; opacity: 1; border-right: 0.08em solid transparent; }
    .slide.visible .terminal.typing .terminal-line { animation: terminal-type var(--type-duration, 0.85s) steps(var(--chars, 48),end) forwards; animation-delay: var(--delay, 0s); }
    .slide.visible .terminal.typing .terminal-line:last-child { border-right-color: var(--accent); }
    .terminal-note { width: fit-content; max-width: min(78vw, 820px); margin: clamp(0.9rem,1.8vw,1.5rem) auto 0; padding: clamp(0.5rem,0.9vw,0.75rem) clamp(0.9rem,1.5vw,1.35rem); border-radius: 999px; background: rgba(244,166,42,0.13); border: 1px solid rgba(244,166,42,0.28); color: #ffd28b; font-weight: 800; text-align: center; font-size: clamp(0.68rem,1.05vw,0.92rem); }
    .term-green { color: #39d353; } .term-red { color: #ff6978; } .term-yellow { color: #ffd166; } .term-dim { color: #8b949e; }
    .roadmap { width: min(86vw, 980px); margin: 0 auto; }
    .road-head { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(0.35rem,0.8vw,0.8rem); margin-bottom: clamp(3rem, 16vh, 8rem); }
    .road-item { padding: clamp(0.55rem,1vw,0.9rem); border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--text-muted); font-size: var(--small-size); text-align: center; }
    .road-item.active { background: rgba(244,166,42,0.16); color: #ffd28b; border-color: rgba(244,166,42,0.35); }
    .road-title { text-align: center; }
    .workflow-road { width: min(88vw, 980px); margin: 0 auto; }
    .workflow-network .center-orb { font-family: var(--font-mono); }
    .workflow-node { display: flex; flex-direction: column; }
    .workflow-node h3 { display: flex; align-items: center; white-space: normal; font-size: clamp(0.82rem,1.35vw,1.1rem); color: var(--text-primary); }
    .workflow-node p { font-size: clamp(0.65rem,1vw,0.85rem); }
    .workflow-node.active { background: linear-gradient(160deg, rgba(244,166,42,0.2), rgba(255,255,255,0.035)); border-color: rgba(244,166,42,0.5); }
    .workflow-notes { display: grid; justify-items: center; gap: clamp(0.55rem,1.1vw,0.9rem); margin-top: clamp(0.9rem,1.7vw,1.5rem); }
    .workflow-note-main { width: fit-content; max-width: min(76vw, 760px); padding: clamp(0.46rem,0.85vw,0.7rem) clamp(0.9rem,1.5vw,1.35rem); border-radius: 999px; background: rgba(244,166,42,0.15); border: 1px solid rgba(244,166,42,0.32); color: #ffd28b; font-weight: 800; text-align: center; font-size: clamp(0.72rem,1.08vw,0.96rem); }
    .workflow-note-sub { width: fit-content; max-width: min(70vw, 680px); padding: clamp(0.42rem,0.75vw,0.62rem) clamp(0.85rem,1.35vw,1.2rem); border-radius: clamp(0.35rem,0.7vw,0.65rem); background: rgba(0,0,0,0.74); color: var(--text-primary); font-weight: 700; text-align: center; font-size: clamp(0.66rem,1vw,0.88rem); }
    .summary-road { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(0.8rem,2vw,1.8rem); align-items: stretch; margin-top: clamp(0.8rem,2vh,1.4rem); }
    .summary-box, .next-box { background: linear-gradient(160deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025)); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(0.85rem,1.7vw,1.55rem); }
    .next-box { border-color: rgba(244,166,42,0.32); background: linear-gradient(160deg, rgba(244,166,42,0.14), rgba(255,255,255,0.03)); }
    .next-box h3 { color: var(--accent); font-size: clamp(1rem,2vw,1.75rem); line-height: 1.25; }
    .next-box p { margin-top: clamp(0.45rem,1vw,0.85rem); color: var(--text-primary); }
    .top-title { width: min(88vw, 980px); margin: 0 auto clamp(0.8rem,1.8vw,1.6rem); }
    .progress-bar { position: fixed; top: 0; left: 0; height: clamp(0.12rem,0.35vh,0.22rem); background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0%; z-index: 1000; }
    .nav-dots { position: fixed; right: clamp(0.6rem,1.2vw,1rem); top: 50%; transform: translateY(-50%); display: grid; gap: clamp(0.22rem,0.5vh,0.35rem); z-index: 1000; }
    .nav-dot { width: clamp(0.38rem,0.7vw,0.55rem); height: clamp(0.38rem,0.7vw,0.55rem); border-radius: 50%; background: rgba(255,255,255,0.22); border: none; cursor: pointer; }
    .nav-dot.active { background: var(--accent); }

    /* ===========================================
       ANIMATIONS
       =========================================== */
    .reveal { opacity: 0; transform: translateY(clamp(1rem,3vh,2rem)); transition: opacity var(--duration-normal) var(--ease-out-expo), transform var(--duration-normal) var(--ease-out-expo); }
    .slide.visible .reveal { opacity: 1; transform: translateY(0); }
    @keyframes terminal-type { 0% { width: 0; } 99% { border-right-color: var(--accent); } 100% { width: 100%; border-right-color: transparent; } }
    .reveal:nth-child(2) { transition-delay: 0.08s; } .reveal:nth-child(3) { transition-delay: 0.16s; } .reveal:nth-child(4) { transition-delay: 0.24s; }

    /* ===========================================
       RESPONSIVE LAYOUT OVERRIDES
       =========================================== */
    @media (max-width: 860px), (max-height: 620px) {
      .compare-grid { grid-template-columns: 1fr 1fr; }
      .vs { display: none; }
      .cols-4, .cols-6 { grid-template-columns: repeat(2, 1fr); }
      .cols-3 { grid-template-columns: repeat(3, 1fr); }
      .bottom-nav { display: none; }
      .caption { bottom: clamp(0.7rem,2vh,1.4rem); }
      .terminal { height: min(64vh, 420px); }
    }
  </style>
</head>
<body>
  <div class="progress-bar" aria-hidden="true"></div>
  <nav class="nav-dots" aria-label="幻灯片导航"></nav>
  <main id="slides"></main>

  <script>
    /* ===========================================
       SLIDE DATA: ONE ENTRY PER ORIGINAL IMAGE
       =========================================== */
    const sections = ["引言", "复杂任务的挑战", "复杂开发失控的原因", "SDD的作用", "结语"];

      {n:59,type:"compare",title:"",leftTitle:"归档前",left:["changes 仍停在临时变更目录","代码变了，主 specs 没有更新","后续迭代仍要靠人猜当前状态"],rightTitle:"归档后",right:["增量规范合并回主 specs","系统现状有统一入口","后续开发可以基于最新事实继续推进"],caption:"最后一步 archive，把事实来源带回系统。",nav:4}
    ];

    /* ===========================================
       RENDER HELPERS: PRESERVE ORIGINAL LAYOUT TYPES
       =========================================== */
    const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    function bottomNav(active=0){ return ""; }
    function caption(text){ return text ? `<div class="caption reveal">${esc(text)}</div>` : ""; }
    function titleSlide(s){ return `<section class="slide title-layout" data-slide="${s.n}"><div class="slide-content"><div class="tag reveal">SDD 开发模式 · ${esc(s.ep||'')}</div><h1 class="reveal">${esc(s.title)}</h1><p class="subtitle reveal">${esc(s.subtitle||'')}</p></div></section>`; }
    function agendaSlide(s){ return `<section class="slide agenda-layout" data-slide="${s.n}"><div class="slide-content"><h2 class="reveal">${esc(s.title)}</h2><p class="subtitle reveal">${esc(s.subtitle||'')}</p></div></section>`; }
    function statementSlide(s){ return `<section class="slide statement-layout" data-slide="${s.n}"><div class="slide-content"><div class="crossed reveal">${esc(s.cross)}</div><div class="arrow-down reveal">↓</div><h2 class="reveal"><span class="accent">${esc(s.title)}</span></h2><p class="subtitle reveal">${esc(s.subtitle||'')}</p></div></section>`; }
    function compareSlide(s){ const list = (arr, mark) => `<ul>${arr.map(x=>`<li>${mark ? `<span class="list-mark">${esc(mark)}</span>` : ''}${esc(x)}</li>`).join('')}</ul>`; const note = s.note ? `<div class="bottom-note reveal">${esc(s.note)}</div>` : ''; const heading = s.title ? `<div class="top-title reveal"><h2>${esc(s.title)}</h2></div>` : ''; return `<section class="slide" data-slide="${s.n}"><div class="slide-content">${heading}<div class="compare-grid reveal"><article class="compare-card left"><h3><span class="icon-small">${s.leftIcon||'▧'}</span>${esc(s.leftTitle)}</h3>${list(s.left, s.leftMark)}</article><div class="vs">VS</div><article class="compare-card right"><h3><span class="icon-small">${s.rightIcon||'▣'}</span>${esc(s.rightTitle)}</h3>${list(s.right, s.rightMark)}</article></div>${note}</div></section>`; }
    function cardsSlide(s){ return `<section class="slide" data-slide="${s.n}"><div class="slide-content"><div class="top-title reveal"><h2>${esc(s.title)}</h2></div><div class="card-grid cols-${s.cols} reveal">${s.cards.map(c=>`<article class="info-card"><h3><span class="num">${esc(c[0])}</span>${esc(c[1])}</h3><p>${esc(c[2])}</p></article>`).join('')}</div></div></section>`; }
    function networkSlide(s){ const heading = s.title ? `<div class="top-title reveal"><h2>${esc(s.title)}</h2></div>` : ''; return `<section class="slide" data-slide="${s.n}"><div class="slide-content">${heading}<div class="network reveal"><div class="center-orb">${esc(s.center).replace(/\n/g,'<br>')}</div>${s.items.map((it,i)=>{const parts=it.split('\n');return `<article class="info-card node"><h3><span class="num">0${i+1}</span>${esc(parts[0])}</h3><p>${esc(parts[1]||'')}</p></article>`}).join('')}</div><div class="callout reveal">${esc(s.callout)}</div></div></section>`; }
    function terminalSlide(s){ return `<section class="slide" data-slide="${s.n}"><div class="slide-content"><div class="terminal ${s.typing?'typing':''} reveal"><div class="terminal-bar"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><span>${esc(s.title)}</span><strong>CLAUDE CODE</strong></div><div class="terminal-body">${s.lines.map(([cls,text],i)=>`<div class="terminal-line ${cls}" style="--delay:${(i*0.9).toFixed(1)}s;--chars:${String(text).length};--type-duration:${Math.max(0.7, String(text).length * 0.045).toFixed(2)}s">${esc(text)}</div>`).join('')}</div></div>${s.note ? `<div class="terminal-note reveal">${esc(s.note)}</div>` : ''}</div></section>`; }
    function roadmapSlide(s){ return `<section class="slide" data-slide="${s.n}"><div class="slide-content"><div class="roadmap reveal"><div class="road-head">${["复杂开发为什么会漂","SDD 到底补什么","OpenSpec 如何落地","多智能体与闭环"].map((x,i)=>`<div class="road-item ${i===s.active?'active':''}">${esc(x)}</div>`).join('')}</div><div class="road-title"><div class="tag">10 讲路线图</div><h2>${esc(s.title)}</h2></div></div></div></section>`; }
    function workflowSlide(s){ return `<section class="slide" data-slide="${s.n}"><div class="slide-content"><div class="workflow-road reveal"><div class="network workflow-network"><div class="center-orb">OpenSpec</div>${s.steps.map((step,i)=>`<article class="info-card node workflow-node"><h3><span class="num">0${i+1}</span>${esc(step[0])}</h3><p>${esc(step[1]||'')}</p></article>`).join('')}</div><div class="workflow-notes"><div class="workflow-note-main">${esc(s.noteMain||'')}</div><div class="workflow-note-sub">${esc(s.noteSub||'')}</div></div></div></div></section>`; }
    function summaryRoadSlide(s){ return `<section class="slide" data-slide="${s.n}"><div class="slide-content"><div class="roadmap reveal"><div class="road-head">${["复杂开发为什么会漂","SDD 到底补什么","OpenSpec 如何落地","多智能体与闭环"].map((x,i)=>`<div class="road-item ${i===s.active?'active':''}">${esc(x)}</div>`).join('')}</div><div class="summary-road"><article class="summary-box"><span class="tag">${esc(s.summaryTitle)}</span><ul>${s.summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="next-box"><span class="tag">NEXT</span><h3>${esc(s.nextTitle)}</h3><p>${esc(s.nextSubtitle)}</p></article></div></div></div></section>`; }
    function renderSlide(s){ return ({title:titleSlide,agenda:agendaSlide,statement:statementSlide,compare:compareSlide,cards:cardsSlide,network:networkSlide,terminal:terminalSlide,roadmap:roadmapSlide,workflow:workflowSlide,summaryRoad:summaryRoadSlide}[s.type] || agendaSlide)(s); }
    document.getElementById('slides').innerHTML = slides.map(renderSlide).join('');

    /* ===========================================
       SLIDE PRESENTATION CONTROLLER
       =========================================== */
    class SlidePresentation {
      constructor(){
        this.slides = Array.from(document.querySelectorAll('.slide'));
        this.currentSlide = 0;
        this.navDotsContainer = document.querySelector('.nav-dots');
        this.progressBar = document.querySelector('.progress-bar');
        this.setupIntersectionObserver();
        this.setupKeyboardNav();
        this.setupTouchNav();
        this.setupWheelNav();
        this.setupProgressBar();
        this.setupNavDots();
      }
      goToSlide(index){
        const target = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides[target].scrollIntoView({behavior:'smooth'});
      }
      setupIntersectionObserver(){
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if(entry.isIntersecting){
              entry.target.classList.add('visible');
              this.currentSlide = this.slides.indexOf(entry.target);
              this.updateUI();
            }
          });
        }, {threshold: 0.55});
        this.slides.forEach(slide => observer.observe(slide));
        this.slides[0]?.classList.add('visible');
      }
      setupKeyboardNav(){
        document.addEventListener('keydown', e => {
          if(['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)){ e.preventDefault(); this.goToSlide(this.currentSlide + 1); }
          if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); this.goToSlide(this.currentSlide - 1); }
          if(e.key === 'Home'){ e.preventDefault(); this.goToSlide(0); }
          if(e.key === 'End'){ e.preventDefault(); this.goToSlide(this.slides.length - 1); }
        });
      }
      setupTouchNav(){
        let startY = 0;
        document.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
        document.addEventListener('touchend', e => {
          const delta = startY - e.changedTouches[0].clientY;
          if(Math.abs(delta) > 45) this.goToSlide(this.currentSlide + (delta > 0 ? 1 : -1));
        }, {passive:true});
      }
      setupWheelNav(){
        let locked = false;
        document.addEventListener('wheel', e => {
          if(locked || Math.abs(e.deltaY) < 28) return;
          locked = true;
          this.goToSlide(this.currentSlide + (e.deltaY > 0 ? 1 : -1));
          setTimeout(() => locked = false, 650);
        }, {passive:true});
      }
      setupProgressBar(){ window.addEventListener('scroll', () => this.updateUI(), {passive:true}); }
      setupNavDots(){
        this.navDotsContainer.innerHTML = '';
        this.slides.forEach((_, i) => {
          const btn = document.createElement('button');
          btn.className = 'nav-dot';
          btn.setAttribute('aria-label', `跳转到第 ${i + 1} 页`);
          btn.addEventListener('click', () => this.goToSlide(i));
          this.navDotsContainer.appendChild(btn);
        });
        this.updateUI();
      }
      updateUI(){
        const percent = this.slides.length <= 1 ? 100 : (this.currentSlide / (this.slides.length - 1)) * 100;
        this.progressBar.style.width = `${percent}%`;
        document.querySelectorAll('.nav-dot').forEach((dot, i) => dot.classList.toggle('active', i === this.currentSlide));
      }
    }
    new SlidePresentation();
  </script>
